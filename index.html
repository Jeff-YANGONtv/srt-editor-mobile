<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YGN TV PRODUCTION LAB</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glassmorphism Base */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        /* Enhanced Glass for Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* 3D Button Styles */
        .btn-3d {
            position: relative;
            padding: 12px 24px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            transform: translateY(0);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 0 0 rgba(255, 255, 255, 0.15) inset;
        }

        /* Primary 3D Button (Cyan) */
        .btn-primary-3d {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
        }

        .btn-primary-3d:hover {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            box-shadow: 0 12px 28px rgba(6, 182, 212, 0.6), 0 0 0 0 rgba(255, 255, 255, 0.2) inset;
        }

        /* Secondary 3D Button (Gray) */
        .btn-secondary-3d {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
        }

        .btn-secondary-3d:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.15) inset;
        }

        /* Danger 3D Button (Red) */
        .btn-danger-3d {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.8) 0%, rgba(220, 38, 38, 0.8) 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
        }

        .btn-danger-3d:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9) 0%, rgba(220, 38, 38, 0.9) 100%);
            box-shadow: 0 12px 28px rgba(239, 68, 68, 0.5), 0 0 0 0 rgba(255, 255, 255, 0.15) inset;
        }

        /* Subtitle Card Styling */
        .sub-card {
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sub-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }

        .active-sub {
            border-left-color: #06b6d4;
            background: rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        /* Modal Styling */
        #dataModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(255, 255, 255, 0.05);
        }

        /* Input Styling */
        input[type="text"],
        input[type="file"],
        select,
        textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
            outline: none;
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-right: 8px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        input[type="file"]::file-selector-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.4);
        }

        /* Header Styling */
        header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Floating Action Button */
        .fab-3d {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(6, 182, 212, 0.4), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 50;
        }

        .fab-3d:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 16px 40px rgba(6, 182, 212, 0.6), 0 0 0 0 rgba(255, 255, 255, 0.15) inset;
        }

        .fab-3d:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4), 0 0 0 0 rgba(255, 255, 255, 0.1) inset;
        }

        /* Placeholder Text */
        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.7);
        }

        /* LED Font Effect */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        .led-time {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* LED Start Time (Green) */
        .led-start {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(22, 163, 74, 0.15) 100%);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5), inset 0 0 10px rgba(34, 197, 94, 0.1);
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.8), 0 0 16px rgba(34, 197, 94, 0.4);
        }

        .led-start:hover {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.7), inset 0 0 15px rgba(34, 197, 94, 0.2);
            text-shadow: 0 0 12px rgba(34, 197, 94, 1), 0 0 20px rgba(34, 197, 94, 0.6);
        }

        /* LED End Time (Red) */
        .led-end {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.15) 100%);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5), inset 0 0 10px rgba(239, 68, 68, 0.1);
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 16px rgba(239, 68, 68, 0.4);
        }

        .led-end:hover {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7), inset 0 0 15px rgba(239, 68, 68, 0.2);
            text-shadow: 0 0 12px rgba(239, 68, 68, 1), 0 0 20px rgba(239, 68, 68, 0.6);
        }

        /* LED Pulse Animation */
        @keyframes ledPulse {
            0%, 100% {
                text-shadow: 0 0 8px rgba(34, 197, 94, 0.8), 0 0 16px rgba(34, 197, 94, 0.4);
            }
            50% {
                text-shadow: 0 0 12px rgba(34, 197, 94, 1), 0 0 24px rgba(34, 197, 94, 0.6);
            }
        }

        @keyframes ledPulseRed {
            0%, 100% {
                text-shadow: 0 0 8px rgba(239, 68, 68, 0.8), 0 0 16px rgba(239, 68, 68, 0.4);
            }
            50% {
                text-shadow: 0 0 12px rgba(239, 68, 68, 1), 0 0 24px rgba(239, 68, 68, 0.6);
            }
        }

        .led-start.pulse {
            animation: ledPulse 2s ease-in-out infinite;
        }

        .led-end.pulse {
            animation: ledPulseRed 2s ease-in-out infinite;
        }

        /* Header Branding */
        .header-branding {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #06b6d4;
            opacity: 0.8;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sub-card {
            animation: slideIn 0.3s ease-out;
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .fab-3d {
                bottom: 24px;
                right: 24px;
                width: 48px;
                height: 48px;
            }

            .btn-3d {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="glass p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div id="userPhoto" class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 border border-cyan-400/50 flex items-center justify-center font-bold text-sm shadow-lg shadow-cyan-500/30 flex-shrink-0">
                <i class="fa-solid fa-user text-white"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold leading-none" id="tgUserName">User Name</h1>
                <p class="header-branding mt-1">YGN TV PRODUCTION LAB</p>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-4 flex-1">
        
        <div class="grid grid-cols-2 gap-3 shrink-0">
            <div class="glass-card p-4 flex flex-col gap-2 border-dashed">
                <label class="text-xs text-gray-300 font-bold uppercase ml-1 flex items-center gap-2">
                    <i class="fa-solid fa-video text-cyan-400"></i> Video
                </label>
                <input type="file" id="videoInput" accept="video/*" onchange="handleVideo(this)" class="w-full text-xs text-gray-400">
            </div>
            <div class="glass-card p-4 flex flex-col gap-2 border-dashed">
                <label class="text-xs text-yellow-400 font-bold uppercase ml-1 flex items-center gap-2">
                    <i class="fa-solid fa-file-invoice"></i> SRT
                </label>
                <input type="file" id="srtInput" accept=".srt" onchange="handleSRT(this)" class="w-full text-xs text-gray-400">
            </div>
        </div>

        <div class="rounded-2xl overflow-hidden glass-card shadow-2xl sticky top-20 z-30">
            <video id="mainVideo" class="w-full aspect-video" controls playsinline></video>
        </div>

        <div id="subtitleList" class="space-y-3 pb-32">
            <div class="text-center py-20 text-gray-500 text-xs italic">ဗီဒီယိုနှင့် SRT တင်ပေးပါ</div>
        </div>
    </main>

    <button onclick="openModal()" class="fab-3d">
        <i class="fa-solid fa-save text-white text-2xl"></i>
    </button>

    <div id="dataModal">
        <div class="w-[90%] max-w-[360px] p-8 modal-content space-y-5">
            <h2 class="text-xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-pen-nib text-cyan-400 text-lg"></i> Project Info
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 font-semibold mb-2 block">Editor Name</label>
                    <input type="text" id="popEditor" class="w-full p-3 text-sm" placeholder="Enter your name">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-semibold mb-2 block">Type</label>
                    <select id="popType" class="w-full p-3 text-sm" onchange="toggleSeries()">
                        <option value="Movie">Movie</option>
                        <option value="Series">Series</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-semibold mb-2 block">Title</label>
                    <input type="text" id="popTitle" class="w-full p-3 text-sm" placeholder="Enter title">
                </div>
                <div id="seriesOnly" class="hidden grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 font-semibold mb-2 block">Season</label>
                        <input type="text" id="popSeason" class="w-full p-3 text-center text-sm" placeholder="S01">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-semibold mb-2 block">Episode</label>
                        <input type="text" id="popEpisode" class="w-full p-3 text-center text-sm" placeholder="E01">
                    </div>
                </div>
            </div>
            <div class="flex gap-3 pt-4">
                <button onclick="closeModal()" class="flex-1 btn-3d btn-secondary-3d">Cancel</button>
                <button onclick="uploadToDrive()" class="flex-1 btn-3d btn-primary-3d">SAVE</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbyiU7Z_rbs_LN5iz8rEGs8FI8AJi5ckGXsmykFW2c9nczFqZ8HQVtUBhNwq68LOIe44_w/exec";
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if(user) {
            document.getElementById('tgUserName').innerText = user.first_name;
            document.getElementById('popEditor').value = user.first_name + (user.last_name ? " " + user.last_name : "");
            if(user.photo_url) document.getElementById('userPhoto').innerHTML = `<img src="${user.photo_url}" class="w-full h-full object-cover rounded-full">`;
        }

        let subs = [];
        const video = document.getElementById('mainVideo');

        function handleVideo(el) { if (el.files[0]) video.src = URL.createObjectURL(el.files[0]); }
        function handleSRT(el) {
            const reader = new FileReader();
            reader.onload = (e) => { subs = parseSRT(e.target.result); renderSubs(); };
            reader.readAsText(el.files[0]);
        }

        function parseSRT(data) {
            return data.replace(/\r/g, '').trim().split(/\n\n+/).map(block => {
                const lines = block.split('\n');
                const time = lines.find(l => l.includes(' --> '));
                if(!time) return null;
                const [s, e] = time.split(' --> ');
                return { start: s.trim(), end: e.trim(), text: lines.slice(lines.indexOf(time)+1).join('\n') };
            }).filter(x => x);
        }

        function renderSubs() {
            const list = document.getElementById('subtitleList');
            list.innerHTML = subs.map((s, i) => `
                <div class="sub-card" onclick="seekVideo('${s.start}', this)">
                    <div class="flex justify-between items-center mb-3 gap-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="led-time led-start pulse">${s.start}</span>
                            <span class="text-gray-400 text-xs">➔</span>
                            <span class="led-time led-end pulse">${s.end}</span>
                        </div>
                        <button onclick="event.stopPropagation(); deleteLine(${i})" class="text-red-400/60 hover:text-red-400 transition-colors flex-shrink-0">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                    <textarea class="w-full bg-transparent outline-none text-sm leading-relaxed text-gray-200 resize-none" rows="2" oninput="subs[${i}].text=this.value">${s.text}</textarea>
                </div>
            `).join('');
        }

        function seekVideo(time, el) {
            const p = time.split(':'); const s = p[2].split(',');
            video.currentTime = (parseInt(p[0])*3600) + (parseInt(p[1])*60) + parseInt(s[0]) + (parseInt(s[1])/1000);
            video.play();
            document.querySelectorAll('.sub-card').forEach(c => c.classList.remove('active-sub'));
            el.classList.add('active-sub');
        }

        function deleteLine(i) { subs.splice(i, 1); renderSubs(); }
        function openModal() { if(subs.length > 0) document.getElementById('dataModal').style.display = 'flex'; else alert("SRT အရင်တင်ပါ"); }
        function closeModal() { document.getElementById('dataModal').style.display = 'none'; }
        function toggleSeries() { document.getElementById('seriesOnly').classList.toggle('hidden', document.getElementById('popType').value !== 'Series'); }

        async function uploadToDrive() {
            const editor = document.getElementById('popEditor').value;
            const title = document.getElementById('popTitle').value;
            if(!editor || !title) return alert("အချက်အလက်ဖြည့်ပါ");

            const content = subs.map((s, i) => `${i+1}\n${s.start} --> ${s.end}\n${s.text}\n`).join('\n');
            closeModal();
            if(tg.MainButton) tg.MainButton.setText("SAVING...").show();

            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        action: "saveAndLog", date: new Date().toLocaleDateString('en-GB'),
                        editor, title, type: document.getElementById('popType').value,
                        season: document.getElementById('popSeason').value || "-",
                        episode: document.getElementById('popEpisode').value || "-",
                        content: content
                    })
                });
                if(tg.MainButton) tg.MainButton.hide();
                alert("Cloud ပေါ်သို့ သိမ်းဆည်းပြီးပါပြီ။");
                tg.close();
            } catch (e) { alert("Error: " + e); if(tg.MainButton) tg.MainButton.hide(); }
        }
    </script>
</body>
</html>
